{% extends "layout.html" %}

{% block content %}
<h1>Edit Book</h1>

<form method="post" action="/book/{{ book.id }}/edit">
  <p>
    <label>Title</label><br>
    <input
      type="text"
      name="title"
      value="{{ book.title }}"
    >
  </p>

  <p>
    <label>Author</label><br>
    <input
      type="text"
      name="author"
      value="{{ book.author }}"
    >
  </p>

  <p>
    <label>Description</label><br>
    <textarea name="description">{{ book.description }}</textarea>
  </p>

  <button type="submit">
    Save
  </button>
</form>

<a href="/book">
    Back to list
</a>
{% endblock %}
